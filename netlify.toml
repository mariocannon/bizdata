[build]
  # `prisma migrate deploy` applies any pending migrations to Supabase before
  # the app is built, so a schema change ships with the deploy that needs it.
  command = "node scripts/preflight.mjs && npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  # Must satisfy @netlify/plugin-nextjs, which requires Node 22+.
  NODE_VERSION = "22"
  # Secrets scanning would otherwise flag the DB URL that Prisma reads at build.
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL,DIRECT_URL,SUPABASE_SERVICE_ROLE_KEY,AUTH_PASSWORD,AUTH_SECRET"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The app holds real advertiser contact details — keep it out of search engines
# and out of frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
